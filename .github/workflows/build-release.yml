name: Build Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version to build and publish (e.g. 0.1.1 or v0.1.1)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-release:
    name: Build and Release Unsigned DMG
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Parse and validate release version
        id: release
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          raw="${INPUT_VERSION}"
          version="${raw#v}"
          tag="v${version}"

          if [ -z "$version" ]; then
            echo "::error::Release version cannot be empty." >&2
            exit 1
          fi

          project_version=$(grep -E '^[[:space:]]*MARKETING_VERSION:' project.yml | awk '{print $2}' | tr -d '"'\''')
          if [ -n "$project_version" ] && [ "$version" != "$project_version" ]; then
            echo "::error::Input version '$version' does not match MARKETING_VERSION in project.yml ('$project_version'). Please update project.yml first." >&2
            exit 1
          fi

          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "Building and releasing Ambrosia ${version} (tag: ${tag})"

      - name: Select Xcode 26.3
        run: sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer

      # Ambrosia.xcodeproj is generated from project.yml, not committed --
      # see CLAUDE.md's "Keeping this current" section.
      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build Ambrosia
        shell: bash
        run: |
          set -euo pipefail

          build_dir="${RUNNER_TEMP}/build"
          build_log="${RUNNER_TEMP}/Ambrosia-build.log"

          set -o pipefail
          xcodebuild \
            -project Ambrosia.xcodeproj \
            -scheme Ambrosia \
            -configuration Release \
            -destination "platform=macOS,arch=arm64" \
            -derivedDataPath "$build_dir" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee "$build_log" | xcbeautify --renderer github-actions

      - name: Locate built app
        shell: bash
        run: |
          set -euo pipefail

          app_path=$(find "${RUNNER_TEMP}/build/Build/Products/Release" -maxdepth 1 -name "*.app" -print -quit)

          if [ -z "$app_path" ]; then
            echo "Could not find built .app" >&2
            exit 1
          fi

          echo "APP_PATH=$app_path" >> "$GITHUB_ENV"
          echo "APP_NAME=$(basename "$app_path" .app)" >> "$GITHUB_ENV"

      - name: Ad-hoc sign app
        shell: bash
        run: |
          set -euo pipefail

          # Unsigned builds carry no signature at all, which makes Gatekeeper
          # report "damaged" (instead of the usual "unidentified developer")
          # once the quarantine flag is applied on download. Ad-hoc signing
          # gives it a valid signature so Gatekeeper can evaluate it normally.
          codesign --force --deep --sign - "$APP_PATH"
          codesign --verify --verbose "$APP_PATH"

      - name: Create DMG
        shell: bash
        run: |
          set -euo pipefail

          staging_dir="${RUNNER_TEMP}/dmg-staging"
          rm -rf "$staging_dir"
          mkdir -p "$staging_dir"

          cp -R "$APP_PATH" "$staging_dir/"
          ln -s /Applications "$staging_dir/Applications"

          dmg_path="${RUNNER_TEMP}/${APP_NAME}.dmg"

          hdiutil create \
            -volname "$APP_NAME" \
            -srcfolder "$staging_dir" \
            -ov \
            -format UDZO \
            "$dmg_path"

          echo "DMG_PATH=$dmg_path" >> "$GITHUB_ENV"

      - name: Generate SHA-256 checksum
        shell: bash
        run: |
          set -euo pipefail

          cd "$(dirname "$DMG_PATH")"
          sha_file="${APP_NAME}.dmg.sha256"
          shasum -a 256 "$(basename "$DMG_PATH")" > "$sha_file"
          echo "SHA256_PATH=$(pwd)/$sha_file" >> "$GITHUB_ENV"
          echo "Computed SHA-256:"
          cat "$sha_file"

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-unsigned-dmg
          path: |
            ${{ env.DMG_PATH }}
            ${{ env.SHA256_PATH }}
          if-no-files-found: error
          retention-days: 14

      - name: Attach DMG and checksum to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          tag="${{ steps.release.outputs.tag }}"

          if gh release view "$tag" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload "$tag" "$DMG_PATH" "$SHA256_PATH" --repo "${{ github.repository }}" --clobber
          else
            gh release create "$tag" "$DMG_PATH" "$SHA256_PATH" \
              --repo "${{ github.repository }}" \
              --title "$tag" \
              --generate-notes
          fi

      - name: Request tap cask update
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.TAP_UPDATE_TOKEN }}
          repository: kyrielie/homebrew-yggdrasil
          event-type: app-release
          client-payload: '{"app":"ambrosia","version":"${{ steps.release.outputs.version }}","asset_name":"${{ env.APP_NAME }}.dmg","asset_url":"https://github.com/${{ github.repository }}/releases/download/${{ steps.release.outputs.tag }}/${{ env.APP_NAME }}.dmg"}'
