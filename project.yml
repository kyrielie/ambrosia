# project.yml — regenerate Ambrosia.xcodeproj from this with:
#   xcodegen generate
#
# Every value below was read out of the previous hand-edited
# Ambrosia.xcodeproj/project.pbxproj (bundle IDs, package pins, deployment
# target, entitlements, Info.plist path) rather than guessed — see
# CLAUDE.md's rule against asserting build settings without verifying them.
#
# Why this exists: the AmbrosiaTests target's Sources build phase only
# listed 3 of the 11 files physically present under AmbrosiaTests/ (confirmed
# by reading project.pbxproj directly) — 8 test files, including
# CollectionStoreTests.swift, were on disk but never compiled or run by
# test.sh or CI. Hand-maintaining PBXFileReference/PBXBuildFile entries for
# every new file is exactly the failure mode that produced that drift.
# XcodeGen's folder-based `sources:` below fixes this structurally: every
# .swift file physically present under Ambrosia/ or AmbrosiaTests/ is picked
# up automatically on the next `xcodegen generate`, with no per-file list to
# forget to update.
#
# After this lands: add "Ambrosia.xcodeproj" to .gitignore (it becomes a
# build artifact regenerated from this file, the same follow-up Nectar's own
# project.yml comment flags for itself) and run `xcodegen generate` after
# adding/removing any source file — do not hand-edit project.pbxproj.
#
# test.sh is unchanged by this: it only depends on the "Ambrosia.xcodeproj"
# project name and "Ambrosia" scheme, both reproduced identically below.

name: Ambrosia

options:
  createIntermediateGroups: true
  developmentLanguage: en
  deploymentTarget:
    # The previous project.pbxproj had a project-level/target-level split
    # (project: 14.0, target: 15) with the target value winning at build
    # time. Standardized on 15 here since that's the effective value.
    macOS: "15.0"

# No xcconfig files exist in this repo (unlike Nectar's xcconfig/) — every
# build setting was embedded directly in project.pbxproj, so settings below
# are declared inline per-target instead of inventing xcconfig files that
# aren't actually present in the tree. Both targets set
# PRODUCT_BUNDLE_IDENTIFIER explicitly (matching the previous pbxproj
# values), so no bundleIdPrefix/derivation is relied on here.

# Local remote-package pins, copied verbatim from the previous
# XCRemoteSwiftPackageReference entries in project.pbxproj.
packages:
  SQLite:
    url: https://github.com/stephencelis/SQLite.swift.git
    from: 0.14.1
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation.git
    from: 0.9.0
  SwiftSoup:
    url: https://github.com/scinfu/SwiftSoup.git
    from: 2.6.0
  FlyingFox:
    url: https://github.com/swhitty/FlyingFox
    from: 0.26.2

targets:
  Ambrosia:
    type: application
    platform: macOS
    sources:
      - path: Ambrosia
        excludes:
          - Resources/Info.plist
    info:
      path: Ambrosia/Resources/Info.plist
      properties: {}
    entitlements:
      path: Ambrosia/Ambrosia.entitlements
      properties:
        com.apple.security.app-sandbox: false
        com.apple.security.cs.allow-jit: true
    dependencies:
      - package: SQLite
        product: SQLite
      - package: ZIPFoundation
        product: ZIPFoundation
      - package: SwiftSoup
        product: SwiftSoup
      - package: FlyingFox
        product: FlyingFox
      - package: FlyingFox
        product: FlyingSocks
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: Ambrosia/Ambrosia.entitlements
        CODE_SIGN_IDENTITY: "Apple Development"
        CODE_SIGN_STYLE: Automatic
        CURRENT_PROJECT_VERSION: 1
        DEVELOPMENT_TEAM: S35M3D45Z9
        GENERATE_INFOPLIST_FILE: NO
        MARKETING_VERSION: 0.1.1
        PRODUCT_BUNDLE_IDENTIFIER: com.kyrielie.ambrosia
        PRODUCT_NAME: "$(TARGET_NAME)"
        SWIFT_VERSION: 5.0
        TARGETED_DEVICE_FAMILY: 1

  AmbrosiaTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: AmbrosiaTests
    dependencies:
      - target: Ambrosia
      - package: SQLite
        product: SQLite
    settings:
      base:
        BUNDLE_LOADER: "$(TEST_HOST)"
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.kyrielie.ambrosia.AmbrosiaTests
        PRODUCT_NAME: "$(TARGET_NAME)"
        SWIFT_VERSION: 5.0
        TARGETED_DEVICE_FAMILY: 1
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Ambrosia.app/Contents/MacOS/Ambrosia"

schemes:
  Ambrosia:
    build:
      targets:
        Ambrosia: all
        AmbrosiaTests: [test]
    test:
      config: Debug
      targets:
        - AmbrosiaTests
      commandLineArguments: {}
    run:
      config: Debug
    archive:
      config: Release
